<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-principal { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); text-transform: uppercase; display: block; }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
        #preview-container { margin-top: 20px; display: none; }
        #preview-img { max-width: 100%; max-height: 180px; border-radius: 8px; border: 2px solid #444; }
    </style>
    <!-- Importação do leitor ultra estável via CDN Cloudflare -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <button id="btn-iniciar" class="btn-principal" onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="carregarEProcessarNota(event)">
    
    <div id="preview-container">
        <p style="color:#aaa; font-size:14px; margin-bottom:5px;">Filtro de Alto Contraste Ativo:</p>
        <img id="preview-img" src="" alt="Preview">
    </div>

    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

function carregarEProcessarNota(event) {
    const arquivo = event.target.files[0]; // Captura correta do arquivo físico
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    
    box.style.display = 'none';
    statusTxt.innerText = "⏳ Convertendo e processando imagem...";

    // FileReader evita o bloqueio de segurança do Safari/iPhone
    const leitor = new FileReader();
    
    leitor.onload = function(e) {
        const imagem = new Image();
        imagem.onload = function() {
            analisarMatrizPixels(imagem);
        };
        imagem.src = e.target.result;
    };
    
    leitor.readAsDataURL(arquivo);
}

function analisarMatrizPixels(imagem) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    
    // Otimização matemática baseada no seu motor de gabaritos
    const maxDimensao = 800;
    let largura = imagem.width;
    let altura = imagem.height;
    if (largura > maxDimensao) {
        altura = (imagem.height / imagem.width) * maxDimensao;
        largura = maxDimensao;
    }
    
    canvas.width = largura;
    canvas.height = altura;
    
    // Filtro óptico processado na GPU do celular (Remoção total de sombras)
    ctx.filter = 'grayscale(1) contrast(3.5)';
    ctx.drawImage(imagem, 0, 0, largura, altura);
    
    // Mostra o preview tratado instantaneamente
    const imageDataUrl = canvas.toDataURL("image/jpeg", 0.8);
    previewImg.src = imageDataUrl;
    previewContainer.style.display = "block";
    
    statusTxt.innerText = "⏳ Extraindo dados do QR Code...";

    // Executa a leitura da matriz
    const imageData = ctx.getImageData(0, 0, largura, altura);
    let code = jsQR(imageData.data, largura, altura, { inversionAttempts: "attemptBoth" });

    // Segunda passada: Se a imagem for muito comprida, amplia o centro geométrico
    if (!code) {
        const canvasFocado = document.createElement("canvas");
        const ctxFocado = canvasFocado.getContext("2d");
        canvasFocado.width = 500;
        canvasFocado.height = 500;
        ctxFocado.filter = 'grayscale(1) contrast(4)';
        ctxFocado.drawImage(imagem, largura * 0.05, altura * 0.1, largura * 0.9, altura * 0.8, 0, 0, 500, 500);
        
        const imageDataFocada = ctxFocado.getImageData(0, 0, 500, 500);
        code = jsQR(imageDataFocada.data, 500, 500, { inversionAttempts: "attemptBoth" });
    }

    if (code && code.data) {
        statusTxt.innerText = "🚀 Enviando dados para validação fiscal...";
        enviarDadosParaNuvem(code.data);
    } else {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Não foi possível ler o QR Code.<br><span style='font-size:14px; font-weight:normal; color:#ffcdd2;'>Mantenha o celular estável, posicione o QR Code bem centralizado na câmera e tente tirar a foto um pouco mais de perto (15cm).</span>";
        box.className = "resultado erro";
    }
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkQRCode 
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Erro de comunicação com o servidor.");
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>Falha na conexão com o sistema Terracoin.</span>";
        box.className = "resultado erro";
    });
}
</script>
