<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-principal { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); text-transform: uppercase; display: block; }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <button id="btn-iniciar" class="btn-principal" onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="enviarFotoParaBanco(event)">
    
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

function enviarFotoParaBanco(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    box.style.display = 'none';
    statusTxt.innerText = "⏳ Enviando imagem para processamento na nuvem...";

    const leitor = new FileReader();
    leitor.onload = function(e) {
        // Isola os dados brutos da imagem em Base64 removendo o cabeçalho descritivo
        const fotoBase64 = e.target.result.split(',')[1];
        
        // Dispara o payload diretamente para a nossa RPC do Postgres
        fetch(`${SUPABASE_URL}/rest/v1/rpc/processar_foto_na_nuvem`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ 
                p_id_jogador: document.getElementById('jogador').value, 
                p_imagem_base64: fotoBase64 
            })
        })
        .then(res => {
            if (!res.ok) throw new Error("A nuvem falhou em decodificar o arquivo.");
            return res.json();
        })
        .then(dados => {
            statusTxt.innerText = "";
            box.style.display = "block";
            
            if (dados.erro) {
                box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
                box.className = "resultado erro";
            } else {
                box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
                box.className = "resultado sucesso";
            }
        })
        .catch((erro) => {
            statusTxt.innerText = "";
            box.style.display = "block";
            box.innerHTML = `❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>${erro.message}</span>`;
            box.className = "resultado erro";
        });
    };
    leitor.readAsDataURL(arquivo);
}
</script>
