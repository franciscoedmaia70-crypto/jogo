<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <!-- Biblioteca leve para decodificar o QR Code -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        button { background: #00e676; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #000; width: 100%; margin-top: 20px; }
        video { width: 100%; max-width: 350px; border-radius: 12px; margin-top: 20px; background: #222; display: none; }
        .resultado { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; display: none; }
        .sucesso { background: #1b5e20; color: #a5d6a7; }
        .erro { background: #b71c1c; color: #ef9a9a; }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Validador Terracoin</h2>
    <input type="text" id="jogador" value="jogador_Eudes_Teste" style="padding: 10px; width: 90%; border-radius: 5px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444;">
    
    <!-- Elemento de vídeo direto do celular -->
    <video id="webcam" autoplay playsinline muted></video>
    
    <button onclick="ligarCamera()">📷 Abrir Câmera</button>
    
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#888; font-size:14px;"></p>
</div>

<!-- Canvas oculto apenas para processar a leitura do link -->
<canvas id="canvas" style="display: none;"></canvas>

<script>
const URL_SUA_NUVEM = "https://supabase.co"; 

const video = document.getElementById("webcam");
const canvasElement = document.getElementById("canvas");
const canvas = canvasElement.getContext("2d");
let streamAtiva = null;

async function ligarCamera() {
    document.getElementById('resultado-box').style.display = 'none';
    document.getElementById('status').innerText = "Ligando câmera...";
    
    try {
        streamAtiva = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = streamAtiva;
        video.style.display = "block";
        document.getElementById('status').innerText = "Filmando... Enquadre o QR Code.";
        
        // Inicia a checagem contínua do link
        requestAnimationFrame(lerQRCode);
    } catch (err) {
        document.getElementById('status').innerText = "Erro ao abrir câmera.";
    }
}

function lerQRCode() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        let imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

        if (code) {
            // QR Code encontrado! Encerra a câmera e envia o link direto para o Supabase
            streamAtiva.getTracks().forEach(track => track.stop());
            video.style.display = "none";
            document.getElementById('status').innerText = "Link capturado! Enviando para o Supabase...";
            
            enviarParaSupabase(code.data);
            return;
        }
    }
    requestAnimationFrame(lerQRCode);
}

function enviarParaSupabase(linkQRCode) {
    fetch(URL_SUA_NUVEM, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            id_jogador: document.getElementById('jogador').value, 
            link_qrcode: linkQRCode 
        })
    })
    .then(res => res.json().then(dados => ({ status: res.status, corpo: dados })))
    .then(resposta => {
        const box = document.getElementById('resultado-box');
        box.style.display = "block";
        if (resposta.status === 200) {
            box.innerHTML = `Sucesso!<br>Saldo Atual: ${resposta.corpo.novo_saldo} Terracoins`;
            box.className = "resultado sucesso";
        } else {
            box.innerHTML = `Erro: ${resposta.corpo.erro}`;
            box.className = "resultado erro";
        }
        document.getElementById('status').innerText = "Pronto.";
    })
    .catch(() => {
        const box = document.getElementById('resultado-box');
        box.style.display = "block";
        box.innerHTML = "Erro de conexão com o Supabase.";
        box.className = "resultado erro";
    });
}
</script>
</body>
</html>
