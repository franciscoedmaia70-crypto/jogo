<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

let streamVideo = null;
let escaneando = false;
let canvasInvisivel = null;
let ctxInvisivel = null;

function adicionarLog(texto) {
    const logBox = document.getElementById('log');
    logBox.innerHTML += `<br>> ${texto}`;
    logBox.scrollTop = logBox.scrollHeight;
}

async function alternarScanner() {
    const btn = document.getElementById('btn-scanner');
    const container = document.getElementById('camera-container');
    const box = document.getElementById('resultado-box');
    
    if (escaneando) {
        pararCamera();
        return;
    }

    box.style.display = 'none';
    document.getElementById('log').innerHTML = "";
    adicionarLog("Solicitando câmera com foco otimizado para documentos...");
    
    try {
        // Configurações avançadas nativas de foco e zoom para leitura de código de barras
        streamVideo = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: { exact: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                focusMode: "continuous" // Força o foco dinâmico contínuo
            }
        }).catch(() => {
            return navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        });

        const video = document.getElementById('video');
        video.srcObject = streamVideo;
        video.setAttribute("playsinline", true);
        video.play();

        container.style.display = 'block';
        btn.innerText = "🛑 PARAR SCANNER";
        btn.style.background = "#ff1744";
        escaneando = true;
        
        adicionarLog("Câmera conectada. Iniciando motor de busca de alta precisão...");
        carregarBibliotecaEIniciarLoop();

    } catch (erroCamera) {
        adicionarLog(`Erro ao abrir câmera: ${erroCamera.message}`);
        alert("Por favor, garanta que deu permissão de acesso à câmera no seu navegador.");
    }
}

function pararCamera() {
    const btn = document.getElementById('btn-scanner');
    const container = document.getElementById('camera-container');
    if (streamVideo) {
        streamVideo.getTracks().forEach(track => track.stop());
    }
    escaneando = false;
    container.style.display = 'none';
    btn.innerText = "📷 INICIAR SCANNER AO VIVO";
    btn.style.background = "#00e676";
    adicionarLog("Scanner finalizado.");
}

function carregarBibliotecaEIniciarLoop() {
    const script = document.createElement('script');
    script.src = "https://jsdelivr.net";
    
    script.onload = function() {
        adicionarLog("Processador visual ativado. Aponte para a nota fiscal.");
        canvasInvisivel = document.createElement("canvas");
        ctxInvisivel = canvasInvisivel.getContext("2d");
        requestAnimationFrame(processarFrame);
    };
    document.head.appendChild(script);
}

function processarFrame() {
    if (!escaneando) return;

    const video = document.getElementById('video');

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Otimização matemática: 800px preserva a nitidez das linhas do QR Code sem sobrecarregar o hardware
        const larguraAlvo = 800;
        const alturaAlvo = (video.videoHeight / video.videoWidth) * larguraAlvo;
        
        canvasInvisivel.width = larguraAlvo;
        canvasInvisivel.height = alturaAlvo;
        
        ctxInvisivel.drawImage(video, 0, 0, larguraAlvo, alturaAlvo);
        const imageData = ctxInvisivel.getImageData(0, 0, larguraAlvo, alturaAlvo);
        
        // Configuração 'dontInvert' alterada para tentar ler QR Codes mesmo com sombras severas no papel
        const code = jsQR(imageData.data, larguraAlvo, alturaAlvo, { 
            inversionAttempts: "attemptBoth" 
        });

        if (code && code.data) {
            adicionarLog("ALVO DETECTADO! Extraindo URL fiscal...");
            pararCamera();
            
            document.getElementById('status').innerText = "🚀 Enviando dados para validação fiscal...";
            enviarDadosParaNuvem(code.data);
            return;
        }
    }
    requestAnimationFrame(processarFrame);
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    adicionarLog("Registrando transação na nuvem Terracoin...");

    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkQRCode 
        })
    })
    .then(res => {
        if (!res.ok) throw new Error(`Servidor offline ou recusou chamada (Status: ${res.status})`);
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            adicionarLog(`Falha na validação: ${dados.erro}`);
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            adicionarLog("Saldo e histórico salvos na nuvem!");
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        adicionarLog(`Erro Crítico: ${erro.message}`);
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = `❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>${erro.message}</span>`;
        box.className = "resultado erro";
    });
}
</script>
