<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-principal { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); text-transform: uppercase; display: block; }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
        #preview-container { margin-top: 20px; display: none; }
        #preview-img { max-width: 100%; max-height: 180px; border-radius: 8px; border: 2px solid #444; }
    </style>
    <!-- O comando 'defer' impede que o leitor trave o carregamento inicial da página -->
    <script defer src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <button id="btn-iniciar" class="btn-principal" onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="processarNotaComFocoDinamico(event)">
    
    <div id="preview-container">
        <p style="color:#aaa; font-size:14px; margin-bottom:5px;">Filtro de Alto Contraste Aplicado:</p>
        <img id="preview-img" src="" alt="Preview">
    </div>

    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

function processarNotaComFocoDinamico(event) {
    const arquivo = event.target.files[0]; // Correção do índice de arquivo direto
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');

    box.style.display = 'none';
    statusTxt.innerText = "⏳ Otimizando enquadramento do QR Code...";

    const imagemBlob = URL.createObjectURL(arquivo);
    const imagem = new Image();
    
    imagem.onload = function() {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        
        const larguraOriginal = imagem.width;
        const alturaOriginal = imagem.height;

        // Foca e isola apenas o terço inferior onde os cupons fiscais guardam o QR Code
        const corteLargura = larguraOriginal * 0.85; 
        const corteAltura = alturaOriginal * 0.45;  
        const corteX = (larguraOriginal - corteLargura) / 2;
        const corteY = alturaOriginal * 0.50; 

        // Resolução reduzida para processamento instantâneo no hardware do celular
        canvas.width = 600;
        canvas.height = 600;
        
        // Filtro emulado do OpenCV rodando direto na placa gráfica (GPU) do celular
        ctx.filter = 'grayscale(1) contrast(4)';
        ctx.drawImage(imagem, corteX, corteY, corteLargura, corteAltura, 0, 0, 600, 600);
        
        const imageData = ctx.getImageData(0, 0, 600, 600);
        
        previewImg.src = canvas.toDataURL("image/jpeg", 0.8);
        previewContainer.style.display = "block";
        
        statusTxt.innerText = "⏳ Analisando padrões geométricos...";

        // Garante que o motor de leitura terminou o download assíncrono antes de executar
        if (typeof jsQR === 'undefined') {
            statusTxt.innerText = "";
            box.style.display = "block";
            box.innerHTML = "❌ O motor de leitura está terminando de carregar. Aguarde 2 segundos e envie a foto novamente.";
            box.className = "resultado erro";
            return;
        }

        const code = jsQR(imageData.data, 600, 600, { inversionAttempts: "attemptBoth" });

        if (code && code.data) {
            statusTxt.innerText = "🚀 Enviando dados para validação fiscal...";
            enviarDadosParaNuvem(code.data);
        } else {
            statusTxt.innerText = "";
            box.style.display = "block";
            box.innerHTML = "❌ Não foi possível ler o QR Code.<br><span style='font-size:14px; font-weight:normal; color:#ffcdd2;'>O motor focou na metade inferior do papel. Aproxime um pouco mais o celular mirado apenas no quadrado do QR Code e tire a foto.</span>";
            box.className = "resultado erro";
        }
        
        URL.revokeObjectURL(imagemBlob);
    };
    imagem.src = imagemBlob;
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkQRCode 
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Erro de comunicação com o servidor.");
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>Falha na conexão com o sistema Terracoin.</span>";
        box.className = "resultado erro";
    });
}
</script>
