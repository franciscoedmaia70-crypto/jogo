<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-principal { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); text-transform: uppercase; display: block; }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
        
        #reader { width: 100%; background: #1a1a1a; border-radius: 16px; overflow: hidden; border: 2px solid #333; margin-top: 20px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #reader button { background: #444 !important; color: #fff !important; border: none !important; padding: 10px 15px !important; border-radius: 6px !important; margin: 10px !important; font-weight: bold; }
    </style>
    <!-- Carregamento da biblioteca oficial -->
    <script src="https://unpkg.com" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <!-- GARANTIDO: Botão HTML real e visível na tela -->
    <button id="btn-iniciar" class="btn-principal" onclick="ligarScannerCompleto()">📷 INICIAR ESCANEAMENTO</button>
    
    <div id="reader"></div>
    
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

let html5Qrcode = null;

function ligarScannerCompleto() {
    const readerDiv = document.getElementById("reader");
    const btn = document.getElementById("btn-iniciar");
    const box = document.getElementById('resultado-box');
    
    box.style.display = 'none';
    readerDiv.style.display = "block";
    btn.style.display = "none"; // Oculta o botão inicial para abrir a câmera

    // Instancia o leitor diretamente para pular menus complexos da biblioteca
    html5Qrcode = new Html5Qrcode("reader");
    
    // Força o acionamento direto da câmera traseira (environment)
    html5Qrcode.start(
        { facingMode: "environment" }, 
        {
            fps: 20,
            qrbox: { width: 260, height: 260 }
        },
        onScanSuccess,
        onScanFailure
    ).catch(err => {
        console.error(err);
        // Fallback: Se der erro de câmera por falta de HTTPS, ativa o modo de upload de arquivo automaticamente
        readerDiv.innerHTML = `<div style="padding:20px; color:#aaa;">Seu navegador bloqueou o vídeo por segurança local.<br>Use o botão abaixo para carregar a foto da nota:<br><input type="file" accept="image/*" onchange="escanearArquivoFoto(event)" style="margin-top:15px; color:#fff;"></div>`;
    });
}

function onScanSuccess(decodedText) {
    if (html5Qrcode) {
        html5Qrcode.stop().then(() => {
            document.getElementById("reader").style.display = "none";
            document.getElementById("btn-iniciar").style.display = "block";
        }).catch(err => console.log(err));
    }
    document.getElementById('status').innerText = "🚀 Enviando dados para validação fiscal...";
    enviarDadosParaNuvem(decodedText);
}

function onScanFailure(error) {
    // Ignora frames limpos
}

// Gerencia a leitura se o usuário escolher enviar o arquivo de foto no computador
function escanearArquivoFoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    document.getElementById('status').innerText = "⏳ Analisando arquivo enviado...";
    const scannerArquivo = new Html5Qrcode("reader");
    
    scannerArquivo.scanFile(file, true)
        .then(decodedText => {
            document.getElementById("reader").style.display = "none";
            document.getElementById("btn-iniciar").style.display = "block";
            document.getElementById('status').innerText = "🚀 Enviando dados para validação fiscal...";
            enviarDadosParaNuvem(decodedText);
        })
        .catch(err => {
            document.getElementById('status').innerText = "";
            const box = document.getElementById('resultado-box');
            box.style.display = "block";
            box.innerHTML = "❌ Não foi possível achar um QR Code nessa imagem.<br><span style='font-size:14px; font-weight:normal; color:#ffcdd2;'>Tire a foto de cima da nota, bem quadrada e com boa iluminação.</span>";
            box.className = "resultado erro";
        });
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkQRCode 
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Erro de comunicação com o servidor.");
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>Falha na conexão com o sistema Terracoin.</span>";
        box.className = "resultado erro";
    });
}
</script>
</body>
</html>
