<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        button { background: #00e676; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #000; width: 100%; margin-top: 20px; }
        .video-wrapper { position: relative; width: 100%; max-width: 350px; margin: 20px auto; display: none; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: auto; background: #222; }
        /* Desenha o quadrado verde de foco na tela para ajudar o jogador a enquadrar */
        .mira-scan { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; margin-top: -100px; margin-left: -100px; border: 3px dashed #00e676; border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); pointer-events: none; }
        .resultado { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; display: none; }
        .sucesso { background: #1b5e20; color: #a5d6a7; }
        .erro { background: #b71c1c; color: #ef9a9a; }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Validador Terracoin</h2>
    <input type="text" id="jogador" value="jogador_Eudes_Teste" style="padding: 10px; width: 90%; border-radius: 5px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444;">
    
    <div class="video-wrapper" id="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="mira-scan"></div>
    </div>
    
    <button onclick="ligarCameraNativa()">📷 Abrir Câmera</button>
    
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#888; font-size:14px;"></p>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
const URL_SUA_NUVEM = "https://supabase.co"; 

const video = document.getElementById("webcam");
const cameraBox = document.getElementById("camera-box");
const canvasElement = document.getElementById("canvas");
const canvas = canvasElement.getContext("2d");
let streamAtiva = null;

async function ligarCameraNativa() {
    document.getElementById('resultado-box').style.display = 'none';
    document.getElementById('status').innerText = "Ligando câmera...";
    
    try {
        // Solicita vídeo liso na câmera traseira com foco contínuo nativo
        streamAtiva = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", focusMode: "continuous" }, 
            audio: false 
        });
        video.srcObject = streamAtiva;
        cameraBox.style.display = "block";
        document.getElementById('status').innerText = "Coloque o QR Code dentro do quadrado verde.";
        
        requestAnimationFrame(lerQRCodeAutomatico);
    } catch (err) {
        document.getElementById('status').innerText = "Erro ao abrir câmera.";
    }
}

function lerQRCodeAutomatico() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Forçamos o tamanho do scanner a analisar apenas uma área central de 300x300 pixels
        // Isso remove o peso da imagem gigante e foca nos detalhes do QR Code
        canvasElement.height = 300;
        canvasElement.width = 300;
        
        // Recorta apenas o centro exato do vídeo da câmera
        const sX = (video.videoWidth - 300) / 2;
        const sY = (video.videoHeight - 300) / 2;
        canvas.drawImage(video, sX, sY, 300, 300, 0, 0, 300, 300);
        
        let imageData = canvas.getImageData(0, 0, 300, 300);
        let code = jsQR(imageData.data, 300, 300, { inversionAttempts: "dontInvert" });

        if (code) {
            // Captura automática instantânea! Desliga os sensores físicos do celular
            streamAtiva.getTracks().forEach(track => track.stop());
            cameraBox.style.display = "none";
            document.getElementById('status').innerText = "Link detectado! Enviando para o Supabase...";
            
            enviarParaSupabase(code.data);
            return;
        }
    }
    requestAnimationFrame(lerQRCodeAutomatico);
}

function enviarParaSupabase(linkQRCode) {
    fetch(URL_SUA_NUVEM, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_jogador: document.getElementById('jogador').value, link_qrcode: linkQRCode })
    })
    .then(res => res.json().then(dados => ({ status: res.status, corpo: dados })))
    .then(resposta => {
        const box = document.getElementById('resultado-box');
        box.style.display = "block";
        if (resposta.status === 200) {
            box.innerHTML = `Sucesso!<br>Saldo Atual: ${resposta.corpo.novo_saldo} Terracoins`;
            box.className = "resultado sucesso";
        } else {
            box.innerHTML = `Erro na Nuvem: ${resposta.corpo.erro}`;
            box.className = "resultado erro";
        }
        document.getElementById('status').innerText = "Pronto.";
    })
    .catch(() => {
        const box = document.getElementById('resultado-box');
        box.style.display = "block";
        box.innerHTML = "Erro de conexão com o Supabase.";
        box.className = "resultado erro";
    });
}
</script>
</body>
</html>
