<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        button { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
        #log { margin-top: 15px; font-size: 13px; color: #aaa; text-align: left; background: #1a1a1a; padding: 10px; border-radius: 8px; max-height: 100px; overflow-y: auto; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <button onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="detectarQRCodeNativo(event)">
    
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
    <div id="log"></div>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

function adicionarLog(texto) {
    const logBox = document.getElementById('log');
    logBox.style.display = 'block';
    logBox.innerHTML += `> ${texto}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
}

async function detectarQRCodeNativo(event) {
    // CORRIGIDO: Captura o primeiro arquivo da lista do evento
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    
    box.style.display = 'none';
    document.getElementById('log').innerHTML = "";
    statusTxt.innerText = "⏳ Carregando imagem da foto...";
    adicionarLog("Foto capturada pelo usuário.");

    const imagemBlob = URL.createObjectURL(arquivo);
    const imagem = new Image();
    
    imagem.onload = async function() {
        adicionarLog("Imagem processada pelo navegador.");
        try {
            if (!('BarcodeDetector' in window)) {
                throw new Error("Navegador sem suporte ao BarcodeDetector nativo.");
            }

            adicionarLog("Tentando leitura ultra rápida nativa...");
            const detector = new BarcodeDetector({ formats: ['qr_code'] });
            const barcodes = await detector.detect(imagem);

            if (barcodes.length > 0) {
                adicionarLog("QR Code detectado nativamente!");
                statusTxt.innerText = "🚀 Enviando dados para validação fiscal...";
                enviarDadosParaNuvem(barcodes[0].rawValue);
            } else {
                throw new Error("QR Code não identificado na leitura nativa.");
            }
        } catch (err) {
            adicionarLog(`Aviso: ${err.message}. Ativando scanner reserva (jsQR)...`);
            processarFotoReduzida(imagem, box, statusTxt);
        }
    };
    imagem.src = imagemBlob;
}

function processarFotoReduzida(imagem, box, statusTxt) {
    const script = document.createElement('script');
    script.src = "https://jsdelivr.net";
    
    script.onload = function() {
        adicionarLog("Biblioteca de leitura reserva carregada.");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        
        const maxDimensao = 800;
        let largura = imagem.width;
        let altura = imagem.height;

        if (largura > altura) {
            if (largura > maxDimensao) {
                altura *= maxDimensao / largura;
                largura = maxDimensao;
            }
        } else {
            if (altura > maxDimensao) {
                largura *= maxDimensao / altura;
                altura = maxDimensao;
            }
        }

        canvas.width = largura;
        canvas.height = altura;
        ctx.drawImage(imagem, 0, 0, canvas.width, canvas.height);
        adicionarLog(`Foto redimensionada para ${largura}x${altura}px para análise.`);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: "dontInvert" });

        if (code) {
            adicionarLog("QR Code decodificado com sucesso pela biblioteca!");
            statusTxt.innerText = "🚀 Enviando dados para validação fiscal...";
            enviarDadosParaNuvem(code.data);
        } else {
            adicionarLog("Erro: jsQR não encontrou nenhum quadrado de QR Code válido.");
            statusTxt.innerText = "";
            box.style.display = "block";
            box.innerHTML = "❌ Não foi possível ler o QR Code.<br><span style='font-size:14px; font-weight:normal; color:#ffcdd2;'>Aproxime mais a câmera, foque bem no quadrado e evite sombras ou reflexos fortes na nota.</span>";
            box.className = "resultado erro";
        }
    };
    document.head.appendChild(script);
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    adicionarLog("Conectando ao banco de dados Supabase...");

    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkQRCode 
        })
    })
    .then(res => {
        adicionarLog(`Resposta da nuvem recebida. Código HTTP: ${res.status}`);
        if (!res.ok) throw new Error(`Falha no servidor Supabase (Status: ${res.status}).`);
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            adicionarLog("A nuvem barrou o envio: Nota duplicada.");
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            adicionarLog("Transação concluída com sucesso no banco de dados!");
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        adicionarLog(`Erro Crítico de Conexão: ${erro.message}`);
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = `❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>${erro.message}</span>`;
        box.className = "resultado erro";
    });
}
</script>
</body>
</html>
