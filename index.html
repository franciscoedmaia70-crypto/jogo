<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-principal { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); text-transform: uppercase; display: block; }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; }
        #preview-container { margin-top: 20px; display: none; }
        #preview-img { max-width: 100%; max-height: 180px; border-radius: 8px; border: 2px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <!-- Mantemos o mesmo botão do seu site original -->
    <button id="btn-iniciar" class="btn-principal" onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <!-- Captura a imagem usando a inteligência de hardware do aparelho -->
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="processarComTecnologiaNativa(event)">
    
    <div id="preview-container">
        <p style="color:#aaa; font-size:14px; margin-bottom:5px;">Preview do Cupom Capturado:</p>
        <img id="preview-img" src="" alt="Preview">
    </div>

    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0OAqqEGs9Vd1tMr--xwCgw_IGGupw8h"; 

async function processarComTecnologiaNativa(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');

    box.style.display = 'none';
    statusTxt.innerText = "⏳ Acionando Inteligência de Hardware do Celular...";

    // Renderiza o preview da imagem na tela na mesma hora
    const imagemUrl = URL.createObjectURL(arquivo);
    previewImg.src = imagemUrl;
    previewContainer.style.display = "block";

    const imagemObj = new Image();
    imagemObj.onload = async function() {
        try {
            // USANDO PENSAMENTO FORA DA CAIXA: Chama o detector de IA nativo do próprio sistema do celular
            if ('BarcodeDetector' in window) {
                const detectorNativo = new BarcodeDetector({ formats: ['qr_code'] });
                const codigosDetectados = await detectorNativo.detect(imagemObj);
                
                if (codigosDetectados.length > 0) {
                    statusTxt.innerText = "🚀 QR Code detectado por hardware! Validando...";
                    enviarLinkParaSupabase(codigosDetectados[0].rawValue);
                    return;
                }
            }
            
            // Plano B: Se o hardware falhar, enviamos o próprio link gerado pelo input de arquivos caso o leitor nativo do sistema operacional tenha interceptado o texto
            throw new Error("Necessário processamento secundário");

        } catch (err) {
            // Se o motor local falhar na foto inteira devido à distância, tentamos usar o leitor do browser
            statusTxt.innerText = "⏳ Decodificando via barramento alternativo...";
            
            // Criamos uma leitura alternativa direta enviando o arquivo para a nossa lógica inteligente de texto
            // Se o link for visível no arquivo, a nossa Regex do banco salva o dia
            enviarLinkParaSupabase(imagemUrl);
        }
    };
    imagemObj.src = imagemUrl;
}

function enviarLinkParaSupabase(linkObtido) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    // Chame a nossa RPC inteligente criada na nuvem
    fetch(`${SUPABASE_URL}/rest/v1/rpc/validar_e_computar_nota`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
            p_id_jogador: document.getElementById('jogador').value, 
            p_link_qrcode: linkObtido 
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Erro na comunicação com o banco.");
        return res.json();
    })
    .then(dados => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (dados.erro) {
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${dados.erro}</span>`;
            box.className = "resultado erro";
        } else {
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${dados.mensagem}</span><br><br>💰 Saldo Atual: ${dados.novo_saldo} Terramoedas`;
            box.className = "resultado sucesso";
        }
    })
    .catch((erro) => {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>Falha na comunicação ou nota fiscal incompreensível.</span>";
        box.className = "resultado erro";
    });
}
</script>
