<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Terracoin</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        button { background: #00e676; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #000; width: 100%; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,230,118,0.3); }
        input[type="text"] { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        
        /* Estilos dos alertas grandes para o jogador */
        .resultado { margin-top: 25px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; line-height: 1.5; }
        .sucesso { background: #1b5e20; color: #a5d6a7; border: 2px solid #81c784; box-shadow: 0 0 15px rgba(27,94,32,0.5); }
        .erro { background: #b71c1c; color: #ef9a9a; border: 2px solid #e57373; box-shadow: 0 0 15px rgba(183,28,28,0.5); }
    </style>
</head>
<body>

<div class="container">
    <h2>🪙 Sistema Terracoin</h2>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#888; font-size:14px;">Identificação do Jogador:</label>
    <input type="text" id="jogador" value="jogador_Eudes_Teste">
    
    <!-- Botão transparente e único para o usuário -->
    <button onclick="document.getElementById('input-camera').click()">📷 ESCANEAR NOTA FISCAL</button>
    
    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="processarFotoNativa(event)">
    
    <!-- Caixa onde as mensagens de sucesso ou erro vão pular na tela -->
    <div id="resultado-box" class="resultado"></div>
    <p id="status" style="color:#00e676; font-size:16px; font-weight: bold; margin-top: 20px;"></p>
</div>

<canvas id="hidden-canvas" style="display: none;"></canvas>

<script>
const URL_SUA_NUVEM = "https://supabase.co"; 

function processarFotoNativa(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');
    
    box.style.display = 'none';
    statusTxt.innerText = "⏳ Lendo imagem em segundo plano...";

    const leitorArquivo = new FileReader();
    leitorArquivo.onload = function(e) {
        const imagem = new Image();
        imagem.onload = function() {
            const canvasElement = document.getElementById("hidden-canvas");
            const canvas = canvasElement.getContext("2d");
            
            // Define tamanho ideal para leitura rápida
            canvasElement.width = 800;
            canvasElement.height = (imagem.height / imagem.width) * 800;
            canvas.drawImage(imagem, 0, 0, canvasElement.width, canvasElement.height);
            
            let imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            let code = jsQR(imageData.data, canvasElement.width, canvasElement.height, { inversionAttempts: "dontInvert" });

            if (code) {
                statusTxt.innerText = "🚀 Enviando dados para validação fiscal...";
                enviarDadosParaNuvem(code.data);
            } else {
                statusTxt.innerText = "";
                box.style.display = "block";
                box.innerHTML = "❌ Não foi possível ler o QR Code.<br><span style='font-size:14px; font-weight:normal; color:#ffcdd2;'>A foto pode ter ficado tremida ou muito longe. Aproxime a câmera bem perto do quadrado preto e branco do QR Code e tente novamente!</span>";
                box.className = "resultado erro";
            }
        };
        imagem.src = e.target.result;
    };
    leitorArquivo.readAsDataURL(arquivo);
}

function enviarDadosParaNuvem(linkQRCode) {
    const box = document.getElementById('resultado-box');
    const statusTxt = document.getElementById('status');

    fetch(URL_SUA_NUVEM, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_jogador: document.getElementById('jogador').value, link_qrcode: linkQRCode })
    })
    .then(res => res.json().then(dados => ({ status: res.status, corpo: dados })))
    .then(resposta => {
        statusTxt.innerText = "";
        box.style.display = "block";
        
        if (resposta.status === 200) {
            // ALERTA DE SUCESSO COMPLETO
            box.innerHTML = `🎉 Sucesso!<br><span style='font-size:15px; font-weight:normal;'>${resposta.corpo.mensagem}</span><br><br>💰 Saldo Atual: ${resposta.corpo.novo_saldo} Terracoins`;
            box.className = "resultado sucesso";
        } else {
            // ALERTA DE REJEIÇÃO DA NUVEM
            box.innerHTML = `❌ Erro de Validação:<br><span style='font-size:15px; font-weight:normal;'>${resposta.corpo.erro}</span>`;
            box.className = "resultado erro";
        }
    })
    .catch(() => {
        statusTxt.innerText = "";
        box.style.display = "block";
        box.innerHTML = "❌ Erro Crítico:<br><span style='font-size:15px; font-weight:normal;'>Não foi possível conectar ao servidor do jogo. Verifique sua conexão com a internet.</span>";
        box.className = "resultado erro";
    });
}
</script>
</body>
</html>
